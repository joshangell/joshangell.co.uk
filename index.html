<html>
	<head>
		<meta charset="utf-8"/>

		<title>Josh Angell</title>

		<meta name="description" content="Web developer in Ruthin, North Wales">
		<meta name="keywords" content="">

		<!--[if lt IE 9]>
			<script src="https://raw.githubusercontent.com/aFarkas/html5shiv/master/dist/html5shiv.min.js"></script>
		<![endif]-->

		<meta name="HandheldFriendly" content="true">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<link href='https://necolas.github.io/normalize.css/3.0.2/normalize.css' rel='stylesheet' type='text/css'>
		<link href='https://fonts.googleapis.com/css?family=Playfair+Display|Fauna+One' rel='stylesheet' type='text/css'>
		<style media="screen">
			html {
				-webkit-box-sizing: border-box;
				-moz-box-sizing: border-box;
				box-sizing: border-box;
			}
			*, *:before, *:after {
				-webkit-box-sizing: inherit;
				-moz-box-sizing: inherit;
				box-sizing: inherit;
			}
			body {
				font-family: "Fauna One", times, serif;
				background: url('scafell-web.jpg') center center no-repeat;
				-webkit-background-size: cover;
				-moz-background-size: cover;
				-o-background-size: cover;
				-ms-background-size: cover;
				background-size: cover;
				color: #333;
				overflow: hidden;

				-webkit-user-select: none;
				-moz-user-select: none;
				-ms-user-select: none;
				-o-user-select: none;
				user-select: none;
			}
			h1, h2 {
				font-family: "Playfair Display", helvetica, sans-serif;
			}
			a {
				color: #333;
				text-decoration: none;
			}
			h1 {
				text-align: center;
				font-size: 64px;
				font-size: 4rem;
			}
			h1 span {
				display: block;
				font-size: 16px;
				font-size: 1rem;
			}

			.more {
				position: absolute;
				top: 110%;
				left: 50%;
				margin-left: -200px;
				width: 400px;
				background: #fff;
				padding-top: 24px;
				text-align: center;
				-webkit-transition-duration: 0.25s;
				-moz-transition-duration: 0.25s;
				-ms-transition-duration: 0.25s;
				-o-transition-duration: 0.25s;
				transition-duration: 0.25s;
			}
				.more h2,
				.more .hit-me {
					font-family: "Playfair Display", helvetica, sans-serif;
					text-transform: uppercase;
				}
				.more .hit-me {
					display: block;
					padding: 12px;
					font-size: 13px;
					font-size: 0.8125rem;
				}
				.more .hit-me:hover {
					color: #fff;
					background: #333;
				}
				.more h2,
				.more ul {
					margin: 0 12px 24px 12px;
				}
				.more ul {
					margin: 0 12px 48px 12px;
					list-style: none;
					padding: 0;
					line-height: 1.5;
				}

			.more-open .more {
				top: 200px;
			}
			@media only screen and (max-width : 570px) {
				.more-open .more {
					top: 0;
					bottom: 0;
				}
			}

			.show-more {
				position: absolute;
				bottom: 0;
				left: 50%;
				margin-left: -61px;
				font-size: 91px;
				font-size: 5.6875rem;
				width: 112px;
				display: block;
				text-align: center;
				cursor: pointer;
			}
			.show-more:hover {
				bottom: 6px;
				-webkit-transition-duration: 0.25s;
				-moz-transition-duration: 0.25s;
				-ms-transition-duration: 0.25s;
				-o-transition-duration: 0.25s;
				transition-duration: 0.25s;
			}
			.more-open .show-more {
				-webkit-transform: rotate(-45deg);
				-moz-transform: rotate(-45deg);
				-ms-transform: rotate(-45deg);
				-o-transform: rotate(-45deg);
				transform: rotate(-45deg);
			}
		</style>
		<script src="https://code.jquery.com/jquery-1.11.1.min.js" charset="utf-8"></script>
	</head>
	<body>
		<h1>I make websites<span>with <a href="https://craftcms.com">Craft</a></span></h1>
		<div class="more">
			<h2>Selected Projects</h2>
			<ul>
				<li><a href="https://cheerfullygiven.com">Cheerfully Given</a></li>
				<li><a href="https://rockinstickers.com">Rockin’ Stickers</a></li>
				<li><a href="https://bournvillebookfest.com">Bournville BookFest</a></li>
				<li><a href="https://www.frettabladid.is">Fréttablaðið</a></li>
				<li><a href="http://www.applywithoscar.org/">Core platform of OSCAR</a></li>
			</ul>
			<a href="mailto:josh@angell.io" class="hit-me">Get in touch</a>
		</div>
		<a type="button" class="show-more">+</a>
		<script charset="utf-8">
			$(function(){

				$('.show-more').on('click', function(){

					if ( $('body').hasClass('more-open') )
					{
						$('body').removeClass('more-open');
					}
					else
					{
						$('body').addClass('more-open');
					}

				});

			});
		</script>
	</body>
</html>
